name: iOS simulator build

on:
  push:
    branches:
      - ios/wkwebview-native-playback

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/ios/wkwebview-native-playback'
    runs-on: macos-26
    steps:
      - name: Check out iOS branch
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS simulator app without signing secrets
        run: >-
          xcodebuild
          -project RadioCoravox-iOS/RadioCoravox/RadioCoravox.xcodeproj
          -scheme RadioCoravox
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/RadioCoravoxDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: RadioCoravox-iOS-simulator
          path: ${{ runner.temp }}/RadioCoravoxDerivedData/Build/Products/Debug-iphonesimulator/RadioCoravox.app
          if-no-files-found: error
          retention-days: 7
